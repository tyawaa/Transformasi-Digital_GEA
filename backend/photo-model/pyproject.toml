[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gea-photo-model"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.9.0",
  "transformers==4.57.1",
  "Pillow==12.0.0",
  "numpy==2.2.6",
  "rapidocr==3.4.2",
  "onnxruntime==1.23.2",
  "fastapi==0.121.3",
  "uvicorn==0.38.0",
  "python-multipart==0.0.20",
  "huggingface-hub==0.36.2",
  "pydantic==2.14.4",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["ruff==0.14.6", "httpx==0.28.1", "mypy==1.19.0"]
mobile = ["onnx==1.20.1"]

[project.scripts]
gea-photo = "gea_photo.cli:main"

[tool.setuptools.packages.find]
include = ["gea_photo*"]

[tool.setuptools.package-data]
gea_photo = ["licenses/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "rapidocr.*"]
follow_imports = "skip"
