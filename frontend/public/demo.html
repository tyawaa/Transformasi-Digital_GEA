<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEA · Demo Mobile</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 16px;
        background: #ede9e2;
        color: #645c50;
        font: 12px system-ui, sans-serif;
      }
      .phone {
        height: min(860px, calc(100dvh - 152px), calc((100vw - 32px) * 844 / 390));
        aspect-ratio: 390 / 844;
        overflow: hidden;
        border: 8px solid #242424;
        border-radius: 36px;
        background: #fff;
        box-shadow: 0 20px 60px #30291d26;
      }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
      p { margin: 0; letter-spacing: 0.08em; }
      .controls { display: grid; justify-items: center; gap: 8px; text-align: center; }
      .controls p { max-width: 420px; letter-spacing: 0; line-height: 1.5; }
      button {
        border: 1px solid #645c50;
        border-radius: 999px;
        padding: 8px 16px;
        background: #fff;
        color: #30291d;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { cursor: wait; opacity: 0.6; }
    </style>
  </head>
  <body>
    <main class="phone" aria-label="Tampilan aplikasi mobile GEA">
      <iframe src="/" title="Aplikasi GEA" allow="camera; geolocation; autoplay; fullscreen"></iframe>
    </main>
    <p>GEA · DEMO MOBILE</p>
    <div class="controls">
      <button id="reset-demo" type="button" hidden disabled>Ulangi demo</button>
      <p id="demo-status" role="status">Memuat aplikasi…</p>
    </div>
    <script type="module" src="/demo.js"></script>
  </body>
</html>
